[dependency-groups]
dev = [
    "pytest",
    "pytest-httpbin",
    "pytest-timeout",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"setup.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
