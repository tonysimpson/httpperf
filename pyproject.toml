[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "httpperf"
dynamic = ["version"]
description = "An asyncio HTTP client for load testing, built on libcurl."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Tony Simpson", email = "agjasimpson@gmail.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing :: Traffic Generation",
]

[project.urls]
Source = "https://github.com/tonysimpson/httpperf"

[tool.setuptools]
packages = ["httpperf"]

[tool.setuptools.dynamic]
version = { attr = "httpperf.version.__version__" }

[dependency-groups]
dev = [
    "aioquic",
    "clang-format==19.1.7",
    "hypercorn",
    "pytest",
    "pytest-httpbin",
    "pytest-timeout",
    "ruff",
]

[tool.cibuildwheel]
build = "cp3*"
skip = "cp3??t-*"
before-all = "sh {project}/tools/build-libcurl.sh"
test-requires = ["pytest", "pytest-timeout", "pytest-httpbin"]
test-command = [
    "python {project}/tools/wheel_smoke.py",
    "pytest -p no:cacheprovider {project}/tests/test_httpbin.py {project}/tests/test_engine.py {project}/tests/test_response.py {project}/tests/test_cookie.py",
]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_34"
manylinux-aarch64-image = "manylinux_2_34"

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
