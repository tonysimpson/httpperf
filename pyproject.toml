[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "acurl"
dynamic = ["version"]
description = "An asyncio HTTP client for load testing, built on libcurl."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Tony Simpson", email = "agjasimpson@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing :: Traffic Generation",
]

[project.urls]
Source = "https://github.com/tonysimpson/acurl"

[tool.setuptools]
packages = ["acurl"]

[tool.setuptools.dynamic]
version = { attr = "acurl.version.__version__" }

[dependency-groups]
dev = [
    "aioquic",
    "hypercorn",
    "pytest",
    "pytest-httpbin",
    "pytest-timeout",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
